<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020b08"/>
      <stop offset="100%" stop-color="#001b12"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7ffb7"/>
      <stop offset="50%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#008f42"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Matrix code columns -->
  <g fill="#00ff66" font-family="monospace" font-size="20"
     opacity=".45">
    <text x="35" y="70">01</text>
    <text x="35" y="110">10</text>
    <text x="35" y="150">AI</text>
    <text x="35" y="190">01</text>
    <text x="35" y="230">11</text>

    <text x="450" y="70">10</text>
    <text x="450" y="110">01</text>
    <text x="450" y="150">11</text>
    <text x="450" y="190">AI</text>
    <text x="450" y="230">10</text>

    <text x="100" y="460">101010</text>
    <text x="320" y="460">010101</text>
  </g>

  <!-- Outer circuit ring -->
  <circle cx="256" cy="235" r="158"
          fill="none" stroke="#00ff66"
          stroke-width="4" opacity=".8"
          filter="url(#glow)"/>

  <!-- AI core -->
  <path d="M256 105 L365 168 L365 295
           L256 358 L147 295 L147 168 Z"
        fill="#031b10"
        stroke="url(#neon)"
        stroke-width="7"
        filter="url(#glow)"/>

  <!-- AI letters -->
  <text x="256" y="255"
        text-anchor="middle"
        font-family="Arial"
        font-size="100"
        font-weight="900"
        fill="url(#neon)"
        filter="url(#glow)">AI</text>

  <!-- Digital circuit connections -->
  <g stroke="#00ff66" stroke-width="5"
     fill="none" filter="url(#glow)">
    <path d="M147 190 H90 V150 H65"/>
    <path d="M365 190 H420 V150 H447"/>
    <path d="M147 275 H90 V315 H65"/>
    <path d="M365 275 H420 V315 H447"/>
  </g>

  <!-- Brand name -->
  <text x="256" y="405"
        text-anchor="middle"
        font-family="Arial"
        font-size="29"
        font-weight="bold"
        fill="#ffffff">JUNIOR DANGOTE</text>

  <text x="256" y="440"
        text-anchor="middle"
        font-family="Arial"
        font-size="24"
        font-weight="bold"
        fill="#00ff66">TWIN</text>

  <!-- Bottom digital indicator -->
  <text x="256" y="480"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        letter-spacing="4"
        fill="#00ff66">INTELLIGENCE ONLINE</text>
</svg>
